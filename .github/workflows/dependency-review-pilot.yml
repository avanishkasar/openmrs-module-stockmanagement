name: Dependency review pilot
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    uses: ./.github/workflows/dependency-review-reusable.yml
    with:
      fail-on-severity: high
      comment-summary-in-pr: always
